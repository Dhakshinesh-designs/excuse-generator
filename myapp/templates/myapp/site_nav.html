<header class="site-header sticky top-0 z-40 border-b border-white/10 bg-zinc-950/90 backdrop-blur">
    <nav aria-label="Main navigation" class="mx-auto flex min-h-[68px] max-w-6xl flex-wrap items-center justify-between gap-3 px-4 py-3 sm:px-6">
        <a href="{% url 'index' %}" class="focus-ring flex items-center gap-2.5 text-sm font-black tracking-[.11em] text-white no-underline">
            <span class="grid h-9 w-9 place-items-center rounded-xl border border-orange-400/30 bg-gradient-to-br from-orange-400/20 to-rose-500/15 text-lg text-orange-300" aria-hidden="true">✦</span>
            <span class="text-gradient">SICKO-EXCUSE</span>
        </a>
        <div class="flex flex-wrap items-center gap-1 text-sm">
            <a class="focus-ring rounded-full border border-transparent px-3 py-2 text-zinc-300 transition hover:border-white/10 hover:bg-white/5 hover:text-white {% if request.resolver_match.url_name == 'index' %}border-orange-400/20 bg-orange-400/10 text-orange-200{% endif %}" href="{% url 'index' %}" {% if request.resolver_match.url_name == 'index' %}aria-current="page"{% endif %}>Generator</a>
            <a class="focus-ring rounded-full border border-transparent px-3 py-2 text-zinc-300 transition hover:border-white/10 hover:bg-white/5 hover:text-white {% if request.resolver_match.url_name == 'faq' %}border-orange-400/20 bg-orange-400/10 text-orange-200{% endif %}" href="{% url 'faq' %}" {% if request.resolver_match.url_name == 'faq' %}aria-current="page"{% endif %}>FAQs</a>
            <a class="focus-ring rounded-full border border-transparent px-3 py-2 text-zinc-300 transition hover:border-white/10 hover:bg-white/5 hover:text-white {% if request.resolver_match.url_name == 'errors' %}border-orange-400/20 bg-orange-400/10 text-orange-200{% endif %}" href="{% url 'errors' %}" {% if request.resolver_match.url_name == 'errors' %}aria-current="page"{% endif %}>Error codes</a>
            <a class="focus-ring rounded-full border border-transparent px-3 py-2 text-zinc-300 transition hover:border-white/10 hover:bg-white/5 hover:text-white {% if request.resolver_match.url_name == 'about' %}border-orange-400/20 bg-orange-400/10 text-orange-200{% endif %}" href="{% url 'about' %}" {% if request.resolver_match.url_name == 'about' %}aria-current="page"{% endif %}>About</a>
        </div>
        <div class="flex items-center gap-2 text-sm">
            {% if user.is_authenticated %}
            <a class="focus-ring rounded-full border border-white/10 px-3 py-2 text-zinc-200 hover:bg-white/5" href="{% url 'profile' %}">Profile</a>
            <form method="post" action="{% url 'logout' %}">{% csrf_token %}<button class="focus-ring rounded-full border border-white/10 px-3 py-2 text-zinc-300 hover:bg-white/5" type="submit">Log out</button></form>
            {% else %}
            <a class="focus-ring rounded-full px-3 py-2 text-zinc-300 hover:text-white" href="{% url 'login' %}">Log in</a>
            <a class="focus-ring rounded-full border border-orange-400/30 bg-orange-400/10 px-3 py-2 text-orange-200" href="{% url 'register' %}">Sign up</a>
            {% endif %}
        </div>
    </nav>
</header>
