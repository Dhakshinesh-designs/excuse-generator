{% load static %}
<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Excuse Generator help, frequently asked questions, and error-code guide.">
    <link rel="icon" type="image/svg+xml" href="{% static 'myapp/favicon.svg' %}">
    <title>{% block title %}Sicko-Excuse{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            color-scheme: dark;
            --page: #100b12;
            --panel: #19121c;
            --panel-raised: #211827;
            --line: #392940;
            --ink: #fffaf7;
            --muted: #b6a8bb;
            --soft: #87788d;
            --orange: #ff9a37;
            --pink: #ff3158;
            --cyan: #66e4ee;
        }
        * { box-sizing: border-box; }
        body {
            min-width: 320px;
            background:
                radial-gradient(ellipse at 74% 2%, rgba(120,45,37,.22), transparent 34rem),
                radial-gradient(ellipse at 12% 48%, rgba(66,34,69,.16), transparent 38rem),
                var(--page);
            color: var(--ink);
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }
        button, input, textarea { font: inherit; }
        button { color: inherit; }
        .bg-glass {
            border: 1px solid rgba(229,190,235,.13);
            background: linear-gradient(150deg, rgba(35,25,40,.93), rgba(23,16,27,.96));
            box-shadow: 0 24px 70px rgba(0,0,0,.2);
            backdrop-filter: blur(16px);
        }
        .text-gradient {
            background: linear-gradient(100deg, #ffc477 1%, #ff753e 47%, #ff3d61 93%);
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .focus-ring:focus-visible { outline: 2px solid var(--cyan); outline-offset: 3px; }
        .site-content { width: min(1040px, calc(100% - 40px)); margin: 0 auto; padding: 48px 0 88px; }
        .page-hero { margin: 0 auto 34px; text-align: center; }
        .page-eyebrow {
            margin: 0 0 15px;
            color: #ffc073;
            font-family: "JetBrains Mono", monospace;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: .19em;
            text-transform: uppercase;
        }
        .page-title {
            margin: 0;
            color: var(--ink);
            font-size: clamp(42px, 7vw, 76px);
            font-weight: 900;
            letter-spacing: -.075em;
            line-height: .98;
        }
        .page-description {
            max-width: 680px;
            margin: 18px auto 0;
            color: var(--muted);
            font-size: clamp(15px, 2vw, 18px);
            line-height: 1.75;
        }
        .content-panel {
            border: 1px solid rgba(229,190,235,.13);
            border-radius: 24px;
            background: linear-gradient(150deg, rgba(35,25,40,.93), rgba(23,16,27,.96));
            box-shadow: 0 24px 70px rgba(0,0,0,.2);
        }
        .faq-list { display: grid; gap: 12px; }
        .faq-item { overflow: hidden; transition: border-color .18s ease, transform .18s ease; }
        .faq-item:hover { transform: translateY(-1px); border-color: rgba(255,154,55,.34); }
        .faq-item summary {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            padding: 22px 26px;
            color: var(--ink);
            cursor: pointer;
            font-size: clamp(15px, 2vw, 18px);
            font-weight: 800;
            list-style: none;
        }
        .faq-item summary::-webkit-details-marker { display: none; }
        .faq-item summary::after { color: #ffad59; content: "+"; font-size: 24px; font-weight: 500; line-height: 1; }
        .faq-item[open] summary::after { content: "−"; }
        .faq-answer { margin: 0 26px; padding: 0 0 22px; border-top: 1px solid rgba(255,255,255,.08); }
        .faq-answer p { max-width: 820px; margin: 17px 0 0; color: var(--muted); line-height: 1.8; }
        .error-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
        .error-card { padding: clamp(20px, 3vw, 27px); transition: border-color .18s ease, transform .18s ease; }
        .error-card:hover { transform: translateY(-2px); border-color: rgba(255,154,55,.34); }
        .error-card-heading { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
        .error-code {
            display: inline-flex;
            min-width: 68px;
            min-height: 39px;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(255,154,55,.28);
            border-radius: 12px;
            background: rgba(255,154,55,.09);
            color: #ffc278;
            font-family: "JetBrains Mono", monospace;
            font-size: 16px;
            font-weight: 700;
        }
        .error-label { color: var(--soft); font-family: "JetBrains Mono", monospace; font-size: 10px; letter-spacing: .12em; text-transform: uppercase; }
        .error-card h2 { margin: 17px 0 0; color: var(--ink); font-size: clamp(19px, 2.4vw, 24px); font-weight: 850; letter-spacing: -.035em; }
        .error-explanation { margin: 11px 0 0; color: var(--muted); line-height: 1.7; }
        .error-action { margin-top: 19px; padding: 14px 16px; border-left: 2px solid #ff8c43; border-radius: 0 12px 12px 0; background: rgba(255,255,255,.035); }
        .error-action p { margin: 0; color: var(--muted); font-size: 13px; line-height: 1.65; }
        .error-action strong { display: block; margin-bottom: 4px; color: #ffc278; font-size: 12px; }
        .about-intro { display: grid; grid-template-columns: auto minmax(0, 1fr); align-items: start; gap: 24px; padding: clamp(22px, 4vw, 38px); }
        .about-intro-mark {
            display: grid;
            width: 52px;
            height: 52px;
            place-items: center;
            border: 1px solid rgba(255,154,55,.3);
            border-radius: 17px;
            background: linear-gradient(145deg, rgba(255,165,73,.2), rgba(255,49,88,.18));
            color: #ffc278;
            font-size: 24px;
        }
        .about-intro .page-eyebrow { margin-bottom: 8px; }
        .about-intro h2 { margin: 0; color: var(--ink); font-size: clamp(24px, 4vw, 36px); font-weight: 900; letter-spacing: -.055em; line-height: 1.1; }
        .about-copy { max-width: 780px; margin: 15px 0 0; color: var(--muted); line-height: 1.8; }
        .about-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; margin-top: 18px; }
        .about-card { display: flex; min-height: 240px; flex-direction: column; align-items: flex-start; padding: 22px; color: inherit; text-decoration: none; transition: border-color .18s ease, transform .18s ease; }
        .about-card:hover { transform: translateY(-2px); border-color: rgba(255,154,55,.4); }
        .about-card-icon { display: grid; width: 38px; height: 38px; place-items: center; border: 1px solid rgba(255,154,55,.28); border-radius: 12px; background: rgba(255,154,55,.09); color: #ffc278; font-size: 19px; font-weight: 800; }
        .about-card-kicker { margin-top: 18px; color: #ffc278; font-family: "JetBrains Mono", monospace; font-size: 10px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; }
        .about-card h2 { margin: 7px 0 0; color: var(--ink); font-size: 17px; font-weight: 850; letter-spacing: -.025em; }
        .about-card p { margin: 8px 0 19px; color: var(--muted); font-size: 13px; line-height: 1.65; }
        .about-card-link { display: flex; width: 100%; justify-content: space-between; gap: 8px; margin-top: auto; color: #ffc278; font-size: 12px; font-weight: 750; }
        .about-footnote { margin: 20px 2px 0; color: var(--soft); font-size: 12px; line-height: 1.7; }
        .page-link {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 9px;
            min-height: 44px;
            padding: 11px 16px;
            border: 1px solid rgba(255,154,55,.34);
            border-radius: 999px;
            background: rgba(255,154,55,.08);
            color: #ffc278;
            font-size: 13px;
            font-weight: 750;
            text-decoration: none;
            transition: .18s ease;
        }
        .page-link:hover { border-color: #ff9a37; background: rgba(255,154,55,.15); color: var(--ink); }
        .site-footer { border-top: 1px solid rgba(255,255,255,.08); background: rgba(16,11,18,.74); }
        @media (max-width: 640px) {
            .site-content { width: min(100% - 32px, 1040px); padding-top: 38px; }
            .page-hero { margin-bottom: 26px; }
            .page-title { letter-spacing: -.06em; }
            .error-grid, .about-grid { grid-template-columns: minmax(0, 1fr); }
            .error-card { padding: 21px; }
            .about-card { min-height: 210px; }
            .faq-item summary { padding: 19px 20px; }
            .faq-answer { margin: 0 20px; }
            .about-intro { grid-template-columns: minmax(0, 1fr); gap: 17px; }
        }
    </style>
</head>
<body class="min-h-screen flex flex-col">
    <form id="siteCsrfForm" class="hidden">{% csrf_token %}</form>
    {% include "myapp/site_nav.html" %}
    <main class="site-content flex-1">
        {% block content %}{% endblock %}
    </main>
    <footer class="site-footer px-4 py-6 text-center text-xs text-zinc-500">
        <p>SICKO-EXCUSE // Support and assessment project</p>
        <a class="focus-ring mt-2 inline-block text-neonCyan hover:text-white" href="{% url 'health' %}">Service health</a>
    </footer>
    {% include "myapp/chat_widget.html" %}
</body>
</html>
